[package]
name = "gpui_linux"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "gpui-se Linux backend, pinned at 5779e732, with the ashpd 0.11 file-URI calls adjusted so the crate builds."

[lib]
path = "src/gpui_linux.rs"

[features]
default = ["wayland", "x11"]
    nightly_coverage = []
    test-support = ["gpui/test-support"]
wayland = [
    "bitflags",
    "gpui_wgpu",
    "ashpd/wayland",
    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "filedescriptor",
    "xkbcommon",
    "open",
    "gpui/wayland",
]
x11 = [
    "gpui_wgpu",
    "ashpd",
    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon",
    "xim",
    "x11-clipboard",
    "filedescriptor",
    "open",
    "scap?/x11",
]
screen-capture = ["gpui/screen-capture", "scap"]

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
accesskit = "0.24"
accesskit_unix = "0.17"
anyhow = "1.0.86"
bytemuck = "1"
collections = { package = "collections-gpui-standalone", version = "1.4.4" }
image = "0.25.1"
futures = "0.3"
gpui = { git = "https://github.com/futureboard/gpui-se", rev = "5779e7325fc499906eb7aa19c9156f9dcb96a9cc" }
gpui_wgpu = { git = "https://github.com/futureboard/gpui-se", rev = "5779e7325fc499906eb7aa19c9156f9dcb96a9cc", optional = true, features = ["font-kit"] }
http_client = { package = "http_client-gpui-standalone", version = "1.4.4" }
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
pollster = "0.4"
profiling = "1"
smallvec = { version = "1.6", features = ["const_generics", "union"] }
smol = "2.0"
strum = { version = "0.27.2", features = ["derive"] }
url = "2"
util = { package = "util-gpui-standalone", version = "1.4.4" }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
calloop = "0.14.3"
raw-window-handle = "0.6"
ashpd = { version = "0.11", default-features = false, features = ["async-std"], optional = true }
swash = { version = "0.2.6" }
bitflags = { version = "2", optional = true }
filedescriptor = { version = "0.8.2", optional = true }
open = { version = "5.2.0", optional = true }
xkbcommon = { version = "0.8.0", features = ["wayland", "x11"], optional = true }
scap = { package = "zed-scap", version = "0.0.8-zed", default-features = false, optional = true }
calloop-wayland-source = { version = "0.4.1", optional = true }
wayland-backend = { version = "0.3.3", features = ["client_system", "dlopen"], optional = true }
wayland-client = { version = "0.31.11", optional = true }
wayland-cursor = { version = "0.31.11", optional = true }
wayland-protocols = { version = "0.32.9", features = ["client", "staging", "unstable"], optional = true }
wayland-protocols-plasma = { version = "0.3.9", features = ["client"], optional = true }
wayland-protocols-wlr = { version = "0.3.9", features = ["client"], optional = true }
as-raw-xcb-connection = { version = "1", optional = true }
x11rb = { version = "0.13.1", features = ["allow-unsafe-code", "xkb", "randr", "xinput", "cursor", "resource_manager", "sync", "dri3"], optional = true }
xim = { git = "https://github.com/zed-industries/xim-rs.git", rev = "16f35a2c881b815a2b6cdfd6687988e84f8447d8", features = ["x11rb-xcb", "x11rb-client"], package = "zed-xim", version = "0.4.0-zed", optional = true }
x11-clipboard = { version = "0.9.3", optional = true }
